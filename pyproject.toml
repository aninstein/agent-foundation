[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundation"
version = "0.1.0"
description = "Reusable DeerFlow, wiki memory, voice, model and deployment foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
agent-foundation = "agent_foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
